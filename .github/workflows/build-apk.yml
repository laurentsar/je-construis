name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      # android/ n'est pas versionné : on le régénère à chaque build, ce qui
      # évite de maintenir à la main un dossier généré de 400 fichiers.
      - name: Regenerate Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Configure release signing
        run: python3 ci/patch_signing.py

      - name: Allow local HTTP (sauvegarde Home Assistant)
        run: python3 ci/patch_manifest.py

      - name: Sync versionName from www/version.json
        run: python3 ci/set_version.py

      - name: Set launcher icons
        run: |
          pip install --quiet Pillow
          python3 ci/set_icons.py

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_B64 absent"; exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/signing.p12

      - name: Build release APK (signed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version détectée : $VERSION"

      - name: Rename APK with version
        run: cp android/app/build/outputs/apk/release/app-release.apk "je-construis-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: je-construis-release-apk
          path: je-construis-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Generate release notes from commit message
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Les commits de fonctionnalités (squash merge) listent déjà leurs
          # changements en puces "- ..." : on les reprend comme notes de
          # version, affichées en liste dans l'app (update-check.js). Chaque
          # puce peut être enroulée sur plusieurs lignes dans le commit : on
          # les rejoint avant de les réécrire une puce par ligne. À défaut
          # (commit sans puces), on retombe sur une ligne générique.
          git log -1 --format=%B > commit-msg.txt
          python3 - "$VERSION" <<'PYEOF' > release-notes.txt
          import re, sys
          version = sys.argv[1]
          with open('commit-msg.txt', encoding='utf-8') as f:
              lines = f.read().split('\n')
          bullets = []
          current = None
          collecting = False
          stop_re = re.compile(r'^(Co-Authored-By|Claude-Session|Version\s)')
          for raw in lines:
              line = raw.strip()
              m = re.match(r'^[-*]\s+(.*)', line)
              if m:
                  if current is not None:
                      bullets.append(current)
                  current = m.group(1)
                  collecting = True
                  continue
              if collecting:
                  if line == '' or stop_re.match(line):
                      break
                  current += ' ' + line
          if current is not None:
              bullets.append(current)
          if bullets:
              for b in bullets:
                  print('- ' + b)
          else:
              print('- Mise à jour v' + version)
          PYEOF
          cat release-notes.txt

      - name: Create / update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="je-construis-${{ steps.version.outputs.version }}.apk"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$APK" --clobber
            gh release edit "v${VERSION}" --notes-file release-notes.txt
          else
            gh release create "v${VERSION}" "$APK" --title "Je Construis v${VERSION}" --notes-file release-notes.txt
          fi
          gh release edit "v${VERSION}" --draft=false
